name: CI

# The public pipeline: nonagenticai/ci-workflows/python-service.yml on GitHub-hosted runners,
# with no repository secrets, publishing ghcr.io/nonagenticai/coding-gateway from main.
#
# There is no deploy job. Flux watches the ImagePolicy for this service and rolls it when the
# image changes — the repo never holds cluster credentials.
#
# While this repository was private it ran the private deployment archetype; that job is gone
# rather than gated because GitHub parses a called workflow even when the calling job's `if:`
# is false, so a public repository that keeps a private `uses:` cannot dispatch CI at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: nonagenticai/ci-workflows/.github/workflows/python-service.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: coding-gateway
      src_dir: src
      # Preserve the bespoke /health smoke against the freshly-pushed image. The gateway
      # requires DATABASE_URL even at boot; ENVIRONMENT=testing relaxes the production validator,
      # and /health returns 200 without a live DB/redis.
      build_smoke: |
        docker run -d --name smoke-coding-gateway \
          -e ENABLE_AUTH=false \
          -e ENVIRONMENT=testing \
          -e DATABASE_URL=postgresql+psycopg://smoke:smoke@127.0.0.1:5432/smoke \
          -e REDIS_URL=redis://localhost:6379/0 \
          -p 18687:8687 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:18687/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs smoke-coding-gateway || true
        docker rm -f smoke-coding-gateway || true
        [ "$ok" -eq 1 ]
